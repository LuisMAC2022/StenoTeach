<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steno Canvas Trainer</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background-color 220ms ease;
    }

    body.state-correct { background: #dcfce7; }
    body.state-wrong { background: #fee2e2; }

    steno-trainer,
    steno-shell,
    steno-workspace,
    steno-practice-panel,
    steno-sidebar,
    steno-stats,
    steno-stat,
    steno-history-panel {
      display: block;
    }

    steno-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 2vw, 2.3rem);
      text-align: center;
    }

    steno-workspace {
      display: grid;
      grid-template-columns: minmax(620px, 760px) minmax(360px, 440px);
      justify-content: center;
      align-items: start;
      gap: 22px;
      margin-top: 22px;
    }

    steno-practice-panel,
    steno-sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    canvas {
      width: 100%;
      height: auto;
      margin-top: 14px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: block;
    }

    #board.layout-hidden {
      display: none !important;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    steno-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    steno-stat,
    steno-history-panel {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    steno-history-panel {
      margin-top: 14px;
    }

    steno-stat strong,
    steno-history-panel strong,
    output {
      display: block;
    }

    output {
      margin-top: 8px;
      color: var(--muted);
    }

    code,
    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: rgba(148, 163, 184, 0.18);
      border-radius: 6px;
      padding: 0.12rem 0.36rem;
    }

    .muted { color: var(--muted); }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
      display: grid;
      gap: 8px;
    }

    .history-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 10px;
      align-items: start;
      padding: 10px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .history-badge {
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 8px;
      line-height: 1;
    }

    .history-badge.ok {
      background: #dcfce7;
      color: #166534;
    }

    .history-badge.bad {
      background: #fee2e2;
      color: #991b1b;
    }

    .history-main { min-width: 0; }
    .history-main span {
      display: block;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1160px) {
      steno-workspace { grid-template-columns: minmax(0, 760px); }
    }

    @media (max-width: 900px) {
      steno-shell { padding: 16px; }
      steno-workspace { grid-template-columns: 1fr; }
      steno-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <steno-trainer>
    <steno-shell>
      <h1>Steno Canvas Trainer</h1>

      <steno-workspace>
        <steno-practice-panel>
          <label for="outline">Enter a steno outline</label>
          <input id="outline" type="text" placeholder="Type the shown outline" autocomplete="off" spellcheck="false" />
          <canvas id="board" width="900" height="430" aria-label="Steno keyboard diagram"></canvas>
        </steno-practice-panel>

        <steno-sidebar>
          <steno-stats>
            <steno-stat>
              <strong>Current streak</strong>
              <output id="streakOut" for="outline">0</output>
            </steno-stat>

            <steno-stat>
              <strong>Best streak</strong>
              <output id="bestStreakOut" for="outline">0</output>
            </steno-stat>

            <steno-stat>
              <strong>Attempts</strong>
              <output id="attemptsOut" for="outline">0</output>
            </steno-stat>

            <steno-stat>
              <strong>Level</strong>
              <output id="levelOut" for="outline">1</output>
            </steno-stat>

            <steno-stat>
              <strong>Timer</strong>
              <output id="timerOut" for="outline">—</output>
            </steno-stat>
          </steno-stats>

          <steno-history-panel>
            <strong>Last 10 entered lessons</strong>
            <ul id="historyList" class="history-list muted">
              <li>No attempts yet.</li>
            </ul>
          </steno-history-panel>
        </steno-sidebar>
      </steno-workspace>
    </steno-shell>
  </steno-trainer>

  <script>
    class StenoTrainer extends HTMLElement {}
    class StenoShell extends HTMLElement {}
    class StenoWorkspace extends HTMLElement {}
    class StenoPracticePanel extends HTMLElement {}
    class StenoSidebar extends HTMLElement {}
    class StenoStats extends HTMLElement {}
    class StenoStat extends HTMLElement {}
    class StenoHistoryPanel extends HTMLElement {}

    customElements.define('steno-trainer', StenoTrainer);
    customElements.define('steno-shell', StenoShell);
    customElements.define('steno-workspace', StenoWorkspace);
    customElements.define('steno-practice-panel', StenoPracticePanel);
    customElements.define('steno-sidebar', StenoSidebar);
    customElements.define('steno-stats', StenoStats);
    customElements.define('steno-stat', StenoStat);
    customElements.define('steno-history-panel', StenoHistoryPanel);

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const outlineInput = document.getElementById('outline');
    const streakOut = document.getElementById('streakOut');
    const bestStreakOut = document.getElementById('bestStreakOut');
    const attemptsOut = document.getElementById('attemptsOut');
    const levelOut = document.getElementById('levelOut');
    const timerOut = document.getElementById('timerOut');
    const historyListEl = document.getElementById('historyList');

    const lessons = [
      { target: 'SAT' },
      { target: 'TAEP' },
      { target: 'HEL' },
      { target: 'KOT' },
      { target: 'RUP' },
      { target: 'STAR' },
      { target: 'PAOL' },
      { target: 'WEB' },
      { target: 'SAF' },
      { target: 'KAD' },
      { target: 'WAG' },
      { target: 'PAS' },
      { target: 'HEZ' },
      { target: 'TOF' },
      { target: 'POD' },
      { target: 'RAOG' },
      { target: 'WAES' },
      { target: 'KUZ' },
      { target: 'STAF' },
      { target: 'SPAD' },
      { target: 'KROG' },
      { target: 'PHAS' },
      { target: 'TWEZ' },
      { target: 'SKAFT' },
      { target: 'STAPS' },
      { target: 'KWAED' },
      { target: 'HROG' },
      { target: 'SPAOZ' },
      { target: 'TKOFT' },
      { target: 'WHARPS' }
    ];

    let currentLesson = null;
    let currentStreak = 0;
    let bestStreak = 0;
    let attempts = 0;
    let mistakeStreak = 0;
    let layoutHidden = false;
    let difficultyLevel = 1;
    let level2CorrectStreak = 0;
    let awaitingNext = false;
    let level3TimerId = null;
    let level3TimeLeft = 0;
    let historyEntries = [];
    let audioCtx = null;
    let audioUnlocked = false;

    const keyRects = [
      { id: 'S-', label: 'S', x: 60, y: 70, w: 56, h: 76 },
      { id: 'T-', label: 'T', x: 124, y: 52, w: 56, h: 94 },
      { id: 'P-', label: 'P', x: 188, y: 52, w: 56, h: 94 },
      { id: 'H-', label: 'H', x: 252, y: 52, w: 56, h: 94 },
      { id: 'K-', label: 'K', x: 124, y: 156, w: 56, h: 78 },
      { id: 'W-', label: 'W', x: 188, y: 156, w: 56, h: 78 },
      { id: 'R-', label: 'R', x: 252, y: 156, w: 56, h: 78 },
      { id: '*L', label: '*', x: 340, y: 104, w: 46, h: 58 },
      { id: '*R', label: '*', x: 392, y: 104, w: 46, h: 58 },
      { id: 'A', label: 'A', x: 286, y: 280, w: 60, h: 70 },
      { id: 'O', label: 'O', x: 352, y: 280, w: 60, h: 70 },
      { id: 'E', label: 'E', x: 438, y: 280, w: 60, h: 70 },
      { id: 'U', label: 'U', x: 504, y: 280, w: 60, h: 70 },
      { id: '-F', label: 'F', x: 470, y: 52, w: 56, h: 94 },
      { id: '-P', label: 'P', x: 534, y: 52, w: 56, h: 94 },
      { id: '-L', label: 'L', x: 598, y: 52, w: 56, h: 94 },
      { id: '-T', label: 'T', x: 662, y: 52, w: 56, h: 94 },
      { id: '-D', label: 'D', x: 726, y: 70, w: 56, h: 76 },
      { id: '-R', label: 'R', x: 470, y: 156, w: 56, h: 78 },
      { id: '-B', label: 'B', x: 534, y: 156, w: 56, h: 78 },
      { id: '-G', label: 'G', x: 598, y: 156, w: 56, h: 78 },
      { id: '-S', label: 'S', x: 662, y: 156, w: 56, h: 78 },
      { id: '-Z', label: 'Z', x: 726, y: 156, w: 56, h: 78 },
    ];

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawBoard(activeIds = new Set()) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#f8fafc');
      ctx.fillStyle = g;
      drawRoundedRect(0, 0, canvas.width, canvas.height, 18);
      ctx.fill();

      ctx.fillStyle = 'rgba(37, 99, 235, 0.05)';
      ctx.beginPath();
      ctx.arc(170, 320, 110, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(720, 310, 100, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#334155';
      ctx.font = '600 20px system-ui, sans-serif';
      ctx.fillText('Initial consonants', 76, 28);
      ctx.fillText('Final consonants', 560, 28);
      ctx.fillText('Vowels', 366, 262);

      for (const key of keyRects) {
        const active = activeIds.has(key.id);
        ctx.fillStyle = active ? '#2563eb' : '#e2e8f0';
        ctx.strokeStyle = active ? '#93c5fd' : '#94a3b8';
        ctx.lineWidth = active ? 3 : 2;
        drawRoundedRect(key.x, key.y, key.w, key.h, 14);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = active ? '#ffffff' : '#0f172a';
        ctx.font = '700 28px system-ui, sans-serif';
        const tw = ctx.measureText(key.label).width;
        ctx.fillText(key.label, key.x + key.w / 2 - tw / 2, key.y + key.h / 2 + 10);
      }

      ctx.fillStyle = '#64748b';
      ctx.font = '16px ui-monospace, monospace';
      ctx.fillText('Think in zones: left → center → right', 286, 390);
    }

    function normalizeOutline(raw) {
      return raw.toUpperCase().replace(/\s+/g, '').replace(/\//g, '');
    }

    function parseOutline(outline) {
      const s = normalizeOutline(outline);
      const initial = [];
      const vowels = [];
      const finals = [];
      const active = new Set();

      const initialsSet = new Set(['S','T','K','P','W','H','R']);
      const vowelsSet = new Set(['A','O','*','E','U']);
      const finalsSet = new Set(['F','R','P','B','L','G','T','S','D','Z']);

      let stage = 'initial';

      for (const ch of s) {
        if (ch === '-') {
          stage = 'final';
          continue;
        }

        if (vowelsSet.has(ch)) {
          vowels.push(ch);
          if (ch === '*') {
            active.add('*L');
            active.add('*R');
          } else {
            active.add(ch);
          }
          if (stage !== 'final') stage = 'vowel';
          continue;
        }

        if (stage === 'initial' && initialsSet.has(ch)) {
          initial.push(ch);
          active.add(ch + '-');
          continue;
        }

        if (finalsSet.has(ch)) {
          finals.push(ch);
          active.add('-' + ch);
          stage = 'final';
          continue;
        }
      }

      return { initial, vowels, finals, active, normalized: s };
    }

    function formatOutlineForDisplay(outline) {
      const parsed = parseOutline(outline);
      return [
        parsed.initial.join(''),
        parsed.vowels.join(''),
        parsed.finals.map(ch => '-' + ch).join('')
      ].join('');
    }

    function updateDisplay() {
      const parsed = parseOutline(outlineInput.value);
      if (layoutHidden) {
        canvas.classList.add('layout-hidden');
        canvas.setAttribute('aria-hidden', 'true');
        return parsed;
      }

      canvas.classList.remove('layout-hidden');
      canvas.removeAttribute('aria-hidden');
      drawBoard(parsed.active);
      return parsed;
    }

    function setLayoutVisibility(visible) {
      layoutHidden = !visible;
      canvas.classList.toggle('layout-hidden', layoutHidden);
      canvas.toggleAttribute('hidden', layoutHidden);
      canvas.setAttribute('aria-hidden', layoutHidden ? 'true' : 'false');
      if (visible) updateDisplay();
    }

    function updateStats() {
      streakOut.value = String(currentStreak);
      streakOut.textContent = String(currentStreak);
      bestStreakOut.value = String(bestStreak);
      bestStreakOut.textContent = String(bestStreak);
      attemptsOut.value = String(attempts);
      attemptsOut.textContent = String(attempts);
      levelOut.value = String(difficultyLevel);
      levelOut.textContent = String(difficultyLevel);
      timerOut.value = difficultyLevel === 3 ? String(level3TimeLeft) : '—';
      timerOut.textContent = difficultyLevel === 3 ? `${level3TimeLeft}s` : '—';
    }

    function focusOutline() {
      requestAnimationFrame(() => outlineInput.focus());
    }

    function setBackgroundState(kind = 'neutral') {
      document.body.classList.remove('state-correct', 'state-wrong');
      if (kind === 'correct') document.body.classList.add('state-correct');
      if (kind === 'wrong') document.body.classList.add('state-wrong');
    }

    function renderHistory() {
      if (!historyEntries.length) {
        historyListEl.innerHTML = '<li>No attempts yet.</li>';
        return;
      }

      historyListEl.innerHTML = historyEntries.map((entry) => `
        <li class="history-item">
          <span class="history-badge ${entry.correct ? 'ok' : 'bad'}">${entry.correct ? 'OK' : 'X'}</span>
          <span class="history-main">
            <span><strong><code>${formatOutlineForDisplay(entry.target)}</code></strong></span>
            <span class="muted">You: <code>${formatOutlineForDisplay(entry.guess)}</code></span>
          </span>
        </li>
      `).join('');
    }

    function addHistoryEntry({ guess, target, correct }) {
      historyEntries.unshift({ guess, target, correct });
      historyEntries = historyEntries.slice(0, 10);
      renderHistory();
    }

    function randomLesson() {
      currentLesson = lessons[Math.floor(Math.random() * lessons.length)];
      outlineInput.value = '';
      outlineInput.placeholder = formatOutlineForDisplay(currentLesson.target);
      updateDisplay();
      awaitingNext = false;
      restartLevel3TimerIfNeeded();
      focusOutline();
    }

    function queueNextLesson() {
      awaitingNext = true;
      setTimeout(() => {
        randomLesson();
      }, 650);
    }

    function ensureAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          audioUnlocked = true;
        }).catch(() => {
          audioUnlocked = false;
        });
      } else {
        audioUnlocked = true;
      }

      return audioCtx;
    }

    function unlockAudio() {
      const ctx = ensureAudioContext();
      if (!ctx || audioUnlocked) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      osc.frequency.setValueAtTime(440, ctx.currentTime);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.01);

      audioUnlocked = true;
    }

    function playTone(kind, retried = false) {
      const ctx = ensureAudioContext();
      if (!ctx) return;

      if (ctx.state !== 'running') {
        if (!retried) {
          ctx.resume()
            .then(() => playTone(kind, true))
            .catch(() => {});
        }
        return;
      }

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const frequency = kind === 'correct' ? 880 : 180;

      osc.type = 'sine';
      osc.frequency.setValueAtTime(frequency, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 1);
    }

    function setDifficultyLevel(nextLevel) {
      difficultyLevel = nextLevel;
      if (difficultyLevel !== 3) {
        clearLevel3Timer();
      }
      updateStats();
    }

    function clearLevel3Timer() {
      if (level3TimerId) {
        clearInterval(level3TimerId);
        level3TimerId = null;
      }
      level3TimeLeft = 0;
    }

    function restartLevel3TimerIfNeeded() {
      if (difficultyLevel !== 3 || awaitingNext) return;
      clearLevel3Timer();
      level3TimeLeft = 5;
      updateStats();
      level3TimerId = setInterval(() => {
        level3TimeLeft -= 1;
        updateStats();
        if (level3TimeLeft <= 0) {
          clearLevel3Timer();
          handleTimeoutAsMistake();
        }
      }, 1000);
    }

    function handleTimeoutAsMistake() {
      if (!currentLesson || awaitingNext || difficultyLevel !== 3) return;

      attempts += 1;
      currentStreak = 0;
      mistakeStreak += 1;
      level2CorrectStreak = 0;

      if (mistakeStreak >= 3) {
        setDifficultyLevel(2);
      }

      updateStats();
      addHistoryEntry({ guess: '', target: currentLesson.target, correct: false });
      setBackgroundState('wrong');
      playTone('wrong');
      queueNextLesson();
    }

    function checkLesson(force = false) {
      const parsed = updateDisplay();
      if (!currentLesson || awaitingNext) return;

      if (!parsed.normalized) {
        return;
      }

      const guess = parsed.normalized.replace(/-/g, '');
      const target = currentLesson.target.replace(/-/g, '');

      if (!force && guess.length < target.length) {
        return;
      }

      attempts += 1;
      if (difficultyLevel === 3) clearLevel3Timer();

      if (guess === target) {
        currentStreak += 1;
        mistakeStreak = 0;
        bestStreak = Math.max(bestStreak, currentStreak);

        if (difficultyLevel === 1 && currentStreak >= 10) {
          setLayoutVisibility(false);
          setDifficultyLevel(2);
          level2CorrectStreak = 0;
        } else if (difficultyLevel === 2) {
          level2CorrectStreak += 1;
          if (level2CorrectStreak >= 10) {
            setDifficultyLevel(3);
            level2CorrectStreak = 0;
          }
        }

        updateStats();
        addHistoryEntry({ guess: parsed.normalized, target: currentLesson.target, correct: true });
        setBackgroundState('correct');
        playTone('correct');
      } else {
        currentStreak = 0;
        mistakeStreak += 1;
        level2CorrectStreak = 0;

        if (difficultyLevel === 2 && mistakeStreak >= 3) {
          setLayoutVisibility(true);
          setDifficultyLevel(1);
        } else if (difficultyLevel === 3 && mistakeStreak >= 3) {
          setDifficultyLevel(2);
        }

        updateStats();
        addHistoryEntry({ guess: parsed.normalized, target: currentLesson.target, correct: false });
        setBackgroundState('wrong');
        playTone('wrong');
      }

      queueNextLesson();
    }

    outlineInput.addEventListener('input', () => {
      unlockAudio();
      updateDisplay();
      checkLesson(false);
    });

    outlineInput.addEventListener('keydown', (e) => {
      unlockAudio();
      if (e.key === 'Enter') {
        e.preventDefault();
        checkLesson(true);
      }
    });

    setBackgroundState('neutral');
    drawBoard();
    updateStats();
    renderHistory();
    randomLesson();
    focusOutline();

    window.addEventListener('pointerdown', () => {
      unlockAudio();
      focusOutline();
    });
    window.addEventListener('keydown', unlockAudio);
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) focusOutline();
    });
  </script>
</body>
</html>
