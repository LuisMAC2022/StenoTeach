<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steno Canvas Trainer</title>
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/layout.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <script type="module" src="src/app/init.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site"><h1>Steno Canvas Trainer</h1></header>
  <main id="main-content" class="site">
    <section class="workspace" aria-label="Practice workspace">
      <article class="panel">
        <label for="outline">Enter a steno outline</label>
        <input id="outline" type="text" placeholder="Type the shown outline" autocomplete="off" spellcheck="false" />
        <canvas id="board" width="900" height="430" aria-label="Steno keyboard diagram"></canvas>
      </article>
      <aside class="panel" aria-label="Progress and history">
        <section class="stats" aria-label="Statistics">
		<article class="stat"><strong>Current streak</strong><br><output id="streakOut" for="outline">-</output></br></article>
		<article class="stat"><strong>Best streak</strong><br><output id="bestStreakOut" for="outline">-</output></br></article>
		<article class="stat"><strong>Attempts</strong><br><output id="attemptsOut" for="outline">-</output></br></article>
		<article class="stat"><strong>Accuracy (%)</strong><br><output id="accuracyOut" for="outline"> -%</output></br></article>
		<article class="stat"><strong>Average streak</strong><br><output id="avgStreakOut" for="outline"> -</output></br></article>
		<article class="stat"><strong>Level</strong><br><output id="levelOut" for="outline"> 1</output></br></article>
		<article class="stat"><strong>Timer</strong><br><output id="timerOut" for="outline"> —</output></br></article>
        </section>
        <section class="history-panel"><strong>Last 10 entered lessons</strong><ul id="historyList" class="history-list muted"><li>No attempts yet.</li></ul></section>
      </aside>
    </section>
  </main>
</body>
</html>
